<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Tracer UI</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f4f5; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .timeline { border-left: 2px solid #ddd; margin-left: 20px; padding-left: 20px; }
        .node { margin-bottom: 20px; padding: 15px; background: #fafafa; border: 1px solid #eee; border-radius: 4px; }
        .node h3 { margin-top: 0; }
        .actions { margin-top: 10px; }
        button { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Agent Tracer</h1>
        <p>A local-first, time-travel debugger for multi-agent systems.</p>
        
        <h2>Recent Traces</h2>
        <div id="traces-list">Loading traces...</div>
        
        <h2>Timeline</h2>
        <div class="timeline" id="timeline-container">
            <p>Select a trace to view its nodes.</p>
        </div>
    </div>

    <script>
        async function fetchTraces() {
            try {
                const res = await fetch('/api/traces');
                const data = await res.json();
                const list = document.getElementById('traces-list');
                list.innerHTML = '';
                
                if (data.traces.length === 0) {
                    list.innerHTML = '<p>No traces found.</p>';
                    return;
                }
                
                data.traces.forEach(trace => {
                    const btn = document.createElement('button');
                    btn.textContent = 'Trace: ' + trace.trace_id;
                    btn.onclick = () => fetchNodes(trace.trace_id);
                    list.appendChild(btn);
                });
            } catch (e) {
                document.getElementById('traces-list').innerText = 'Error loading traces.';
            }
        }
        
        async function fetchNodes(traceId) {
            try {
                const res = await fetch(`/api/traces/${traceId}/nodes`);
                const data = await res.json();
                const container = document.getElementById('timeline-container');
                container.innerHTML = '';
                
                data.nodes.forEach(node => {
                    const div = document.createElement('div');
                    div.className = 'node';
                    div.innerHTML = `
                        <h3>Step: ${node.func_name}</h3>
                        <p><strong>Latency:</strong> ${node.latency}s</p>
                        <div class="actions">
                            <button onclick="replayNode('${node.node_id}')">Fork and Replay</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) {
                document.getElementById('timeline-container').innerText = 'Error loading timeline.';
            }
        }

        async function replayNode(nodeId) {
            alert('Fork and Replay initiated for node ' + nodeId);
            // In a real app, this would open a state editor modal.
        }

        fetchTraces();
    </script>
</body>
</html>
