<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 440 440" fill="none" role="img" aria-label="Athar Logo">
  <defs>
    <radialGradient id="athar-bg" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#162934"/>
      <stop offset="60%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#0a1015"/>
    </radialGradient>
    <filter id="teal-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="trace-line-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8d6df"/>
    </linearGradient>
  </defs>

  <!-- Background card with smooth rounded corners -->
  <rect width="440" height="440" rx="32" fill="url(#athar-bg)"/>
  <rect width="438" height="438" x="1" y="1" rx="31" stroke="#1d3442" stroke-width="1.5" fill="none"/>

  <!-- Trace DAG Symbol -->
  <g transform="translate(152, 84)">
    <!-- Branching paths -->
    <path d="M68 16 V55 M68 55 L32 96 M68 55 V104 M68 55 L104 96"
          stroke="url(#trace-line-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Subtle connection node glow -->
    <!-- Root node -->
    <circle cx="68" cy="14" r="6.5" fill="#00D6A3" filter="url(#teal-glow)"/>
    <!-- Fork decision node -->
    <circle cx="68" cy="55" r="5.5" fill="#00D6A3" stroke="#101820" stroke-width="2.5" filter="url(#teal-glow)"/>
    <!-- Branch leaves -->
    <circle cx="32" cy="98" r="6.5" fill="#00D6A3" filter="url(#teal-glow)"/>
    <circle cx="68" cy="106" r="6.5" fill="#00D6A3" filter="url(#teal-glow)"/>
    <circle cx="104" cy="98" r="6.5" fill="#00D6A3" filter="url(#teal-glow)"/>
  </g>

  <!-- Wordmark -->
  <g id="wordmark">
    <text x="220" y="286" text-anchor="middle"
          font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="44" font-weight="700" letter-spacing="0.02em" fill="#F4F7FA">athar</text>
    <text x="220" y="318" text-anchor="middle"
          font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="13" font-weight="500" letter-spacing="0.16em" fill="#8CA3A3">FORK &#183; EDIT &#183; REPLAY</text>
  </g>
</svg>
