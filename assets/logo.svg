<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none" role="img" aria-label="Athar Logo">
  <defs>
    <radialGradient id="athar-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#162c38"/>
      <stop offset="55%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#090e13"/>
    </radialGradient>
    <filter id="teal-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="trace-line-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C2D3DE"/>
    </linearGradient>
  </defs>

  <!-- Sleek rounded squircle container -->
  <rect width="200" height="200" rx="44" fill="url(#athar-bg)"/>
  <rect width="198" height="198" x="1" y="1" rx="43" stroke="#1d3442" stroke-width="1.5" fill="none"/>

  <!-- Trace DAG Symbol (Centered, Pure Mark Only) -->
  <g transform="translate(15, 25) scale(1.25)">
    <!-- Branching paths -->
    <path d="M68 16 V55 M68 55 L32 96 M68 55 V104 M68 55 L104 96"
          stroke="url(#trace-line-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Glowing connection nodes -->
    <!-- Root node -->
    <circle cx="68" cy="14" r="6.5" fill="#00D6A3" filter="url(#teal-glow)"/>
    <!-- Fork decision node -->
    <circle cx="68" cy="55" r="5.5" fill="#00D6A3" stroke="#101820" stroke-width="2.5" filter="url(#teal-glow)"/>
    <!-- Branch leaves -->
    <circle cx="32" cy="98" r="6.5" fill="#00D6A3" filter="url(#teal-glow)"/>
    <circle cx="68" cy="106" r="6.5" fill="#00D6A3" filter="url(#teal-glow)"/>
    <circle cx="104" cy="98" r="6.5" fill="#00D6A3" filter="url(#teal-glow)"/>
  </g>
</svg>
